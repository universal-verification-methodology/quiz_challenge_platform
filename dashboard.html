<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leaderboard · Challenge Platform</title>
    <link rel="stylesheet" href="css/challenge.css?v=19" />
  </head>
  <body class="page-dashboard">
    <header class="site-header">
      <a class="brand" href="index.html">Challenge Platform</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#courses">Courses</a>
        <a href="dashboard.html" aria-current="page">Leaderboard</a>
      </nav>
    </header>

    <main class="dashboard-main">
      <p class="eyebrow">Public ranking</p>
      <h1>Leaderboard</h1>

      <div class="dashboard-toolbar">
        <div class="mode-tabs" role="tablist" aria-label="Quest mode">
          <button type="button" class="mode-tab active" data-mode="full">Full Quest</button>
          <button type="button" class="mode-tab" data-mode="test">Short Quest</button>
        </div>
        <p class="note" id="board-meta">Loading…</p>
      </div>

      <div class="panel dashboard-panel">
        <div class="table-wrap">
          <table class="board-table" id="board-table">
            <thead>
              <tr>
                <th scope="col" data-sort="rank" data-default-dir="asc" aria-sort="none">
                  <button type="button" class="sort-btn">Rank</button>
                </th>
                <th scope="col" data-sort="display_name" data-default-dir="asc" aria-sort="none">
                  <button type="button" class="sort-btn">Player</button>
                </th>
                <th scope="col" data-sort="module_title" data-default-dir="asc" aria-sort="none">
                  <button type="button" class="sort-btn">Module</button>
                </th>
                <th scope="col" data-sort="score" data-default-dir="desc" aria-sort="descending">
                  <button type="button" class="sort-btn">Score</button>
                </th>
                <th scope="col" data-sort="accuracy_pct" data-default-dir="desc" aria-sort="none">
                  <button type="button" class="sort-btn">Accuracy</button>
                </th>
                <th scope="col" data-sort="total_attempts" data-default-dir="desc" aria-sort="none">
                  <button type="button" class="sort-btn">Questions</button>
                </th>
                <th
                  scope="col"
                  data-sort="cleared_levels"
                  data-default-dir="desc"
                  aria-sort="none"
                  title="Correct levels: easy / medium / hard"
                >
                  <button type="button" class="sort-btn">Correct E/M/H</button>
                </th>
                <th scope="col" data-sort="median_ms" data-default-dir="asc" aria-sort="none">
                  <button type="button" class="sort-btn">Median / q</button>
                </th>
                <th scope="col" data-sort="timeouts" data-default-dir="asc" aria-sort="none">
                  <button type="button" class="sort-btn">Timeouts</button>
                </th>
                <th scope="col" data-sort="top_pct" data-default-dir="asc" aria-sort="none">
                  <button type="button" class="sort-btn">Percentile</button>
                </th>
                <th scope="col" data-sort="completed_at" data-default-dir="desc" aria-sort="none">
                  <button type="button" class="sort-btn">Date</button>
                </th>
              </tr>
            </thead>
            <tbody id="board-body">
              <tr>
                <td colspan="11" class="board-empty">Loading rankings…</td>
              </tr>
            </tbody>
          </table>
        </div>
        <p class="note scoring-note" id="scoring-note"></p>
      </div>
    </main>

    <footer class="site-footer">
      Best Full Quest run per person · Short Quest: best per person per module · email never shown
    </footer>

    <script src="js/benchmark.js?v=4"></script>
    <script src="js/dashboard.js?v=5"></script>
  </body>
</html>
