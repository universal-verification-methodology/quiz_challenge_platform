<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report · Digital Foundations Quest</title>
    <link rel="stylesheet" href="css/challenge.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Challenge Platform</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Leaderboard</a>
        <a id="new-quest-link" href="challenge.html?restart=1">New quest</a>
      </nav>
    </header>

    <main>
      <p class="eyebrow">Analytical report</p>
      <h1>Your results</h1>
      <p class="note" id="report-empty" hidden>
        No session found. <a id="empty-start-link" href="challenge.html?restart=1">Start a quest</a> first.
      </p>
      <div id="report-root"></div>
      <section class="panel" id="cert-root" hidden></section>
      <div class="actions" id="report-actions" hidden>
        <a class="btn primary" id="try-again-link" href="challenge.html?restart=1">Try again</a>
        <a class="btn ghost" href="index.html">Home</a>
      </div>
    </main>

    <footer class="site-footer">Certificate unlocks after you share name, email, and (optional) testimony</footer>

    <script src="js/session-log.js?v=6"></script>
    <script src="js/benchmark.js?v=1"></script>
    <script src="js/report.js?v=7"></script>
    <script src="js/results.js?v=6"></script>
    <script src="js/certificate.js?v=15"></script>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        let mode = params.get("test") === "1" ? "test" : "full";

        function hasAttempts(s) {
          return s && s.attempts && s.attempts.length;
        }

        function loadSessionForReport() {
          QCSession.setMode(mode);
          let session = QCSession.load();
          if (hasAttempts(session)) return { session, mode };

          const other = mode === "test" ? "full" : "test";
          QCSession.setMode(other);
          session = QCSession.load();
          if (hasAttempts(session)) return { session, mode: other };

          QCSession.setMode(mode);
          return { session: null, mode };
        }

        async function loadSite() {
          try {
            const res = await fetch("config/site.json?v=5", { cache: "no-store" });
            if (!res.ok) return {};
            return res.json();
          } catch (_) {
            return {};
          }
        }

        const loaded = loadSessionForReport();
        const session = loaded.session;
        mode = loaded.mode;

        const qs = mode === "test" ? "?test=1&restart=1" : "?restart=1";
        const startHref = "challenge.html" + qs;
        ["new-quest-link", "empty-start-link", "try-again-link"].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.href = startHref;
        });

        const empty = document.getElementById("report-empty");
        const root = document.getElementById("report-root");
        const certRoot = document.getElementById("cert-root");
        const actions = document.getElementById("report-actions");

        if (!hasAttempts(session) || QCCertificate.isClaimed(session)) {
          QCSession.setMode(mode);
          QCSession.clear();
          empty.hidden = false;
          return;
        }

        if (mode === "test") {
          const eye = document.querySelector(".eyebrow");
          if (eye) eye.textContent = "Analytical report · test mode";
        }

        QCReport.render(root, session);
        actions.hidden = false;
        certRoot.hidden = false;

        loadSite().then((site) => {
          const requireTestimony =
            !site.certificate || site.certificate.require_testimony !== false;

          QCCertificate.mountForm(certRoot, {
            requireTestimony,
            onClaim: async (identity, statusEl) => {
              const payload = QCResults.buildPayload(session, identity, site);
              QCResults.storeLocalCopy(payload);

              let submitMsg = "";
              if (site.results && site.results.auto_submit !== false && site.results.endpoint) {
                statusEl.textContent = "Sending results securely…";
                const result = await QCResults.submit(payload, site);
                if (result.ok) {
                  submitMsg =
                    " Results saved" +
                    (result.body && result.body.issue_url
                      ? " (GitHub issue opened)."
                      : ".");
                } else if (result.skipped) {
                  submitMsg = " (GitHub sync not configured yet.)";
                } else {
                  submitMsg =
                    " Could not reach the results server; certificate still downloads. Check backend/api.md.";
                }
              } else {
                submitMsg =
                  " GitHub sync is off until you set results.endpoint in config/site.json.";
                QCResults.downloadJson(
                  payload,
                  "quest-result-" + (session.session_id || "local") + ".json"
                );
              }

              QCCertificate.markClaimed(session);
              QCCertificate.downloadCertificatePdf(session, identity, site);
              statusEl.textContent = "Certificate downloaded." + submitMsg + " Resetting the session…";
              QCSession.setMode(mode);
              QCSession.clear();
              history.replaceState(null, "", "index.html");
              setTimeout(() => {
                location.href = "index.html";
              }, 1200);
            },
          });
        });
      })();
    </script>
  </body>
</html>
