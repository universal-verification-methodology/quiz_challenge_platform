<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report · Challenge Quest</title>
    <link rel="stylesheet" href="css/challenge.css?v=19" />
  </head>
  <body class="page-report">
    <header class="site-header no-print">
      <a class="brand" href="index.html">Challenge Platform</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="challenge.html?restart=1">Full Quest</a>
        <a href="challenge.html?short=1&amp;restart=1">Short Quest</a>
        <a href="dashboard.html">Leaderboard</a>
      </nav>
    </header>

    <main class="report-main">
      <p class="note" id="report-empty" hidden>
        No session found. <a id="empty-start-link" href="challenge.html?restart=1">Start a quest</a> first.
      </p>
      <div id="report-root"></div>
      <section class="panel cert-panel-wrap no-print" id="cert-root" hidden></section>
      <div class="actions no-print" id="report-actions" hidden>
        <a class="btn primary" id="try-again-link" href="challenge.html?restart=1">Try again</a>
        <a class="btn ghost" href="index.html">Home</a>
        <a class="btn ghost" href="dashboard.html">Leaderboard</a>
      </div>
    </main>

    <footer class="site-footer no-print">
      Certificate unlocks after you share name, email, and (optional) testimony
    </footer>

    <script src="js/session-log.js?v=8"></script>
    <script src="js/benchmark.js?v=4"></script>
    <script src="js/report.js?v=9"></script>
    <script src="js/results.js?v=9"></script>
    <script src="js/certificate.js?v=19"></script>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        let mode =
          params.get("short") === "1" || params.get("test") === "1" ? "test" : "full";
        let courseId = (params.get("course") || "").trim();

        function hasAttempts(s) {
          return s && s.attempts && s.attempts.length;
        }

        function loadSessionForReport(site) {
          const courses = (site && site.courses) || {};
          const defaultCourse = (site && site.default_course) || "learn_digital";
          if (!courseId || (Object.keys(courses).length && !courses[courseId])) {
            courseId = defaultCourse;
          }
          if (QCSession.setCourse) QCSession.setCourse(courseId);

          QCSession.setMode(mode);
          let session = QCSession.load();
          if (hasAttempts(session)) return { session, mode };

          const other = mode === "test" ? "full" : "test";
          QCSession.setMode(other);
          session = QCSession.load();
          if (hasAttempts(session)) return { session, mode: other };

          const ids = Object.keys(courses);
          for (let i = 0; i < ids.length; i++) {
            if (ids[i] === courseId) continue;
            if (QCSession.setCourse) QCSession.setCourse(ids[i]);
            QCSession.setMode(mode);
            session = QCSession.load();
            if (hasAttempts(session)) {
              courseId = ids[i];
              return { session, mode };
            }
            QCSession.setMode(other);
            session = QCSession.load();
            if (hasAttempts(session)) {
              courseId = ids[i];
              return { session, mode: other };
            }
          }

          if (QCSession.setCourse) QCSession.setCourse(courseId);
          QCSession.setMode(mode);
          return { session: null, mode };
        }

        async function loadSite() {
          try {
            const res = await fetch("config/site.json?v=9", { cache: "no-store" });
            if (!res.ok) return {};
            return res.json();
          } catch (_) {
            return {};
          }
        }

        loadSite().then((site) => {
          const loaded = loadSessionForReport(site);
          const session = loaded.session;
          mode = loaded.mode;
          if (session && session.course_id) courseId = session.course_id;
          if (QCSession.setCourse) QCSession.setCourse(courseId);

          const parts = ["course=" + encodeURIComponent(courseId), "restart=1"];
          if (mode === "test") parts.unshift("short=1");
          const startHref = "challenge.html?" + parts.join("&");
          ["new-quest-link", "empty-start-link", "try-again-link"].forEach((id) => {
            const el = document.getElementById(id);
            if (el) el.href = startHref;
          });
          document.querySelectorAll("a[href*='challenge.html']").forEach((a) => {
            try {
              const url = new URL(a.getAttribute("href"), location.href);
              if (!url.pathname.endsWith("challenge.html")) return;
              url.searchParams.set("course", courseId);
              a.setAttribute(
                "href",
                url.pathname.split("/").pop() + url.search + url.hash
              );
            } catch (_) {}
          });

          const empty = document.getElementById("report-empty");
          const root = document.getElementById("report-root");
          const certRoot = document.getElementById("cert-root");
          const actions = document.getElementById("report-actions");

          if (!hasAttempts(session) || QCCertificate.isClaimed(session)) {
            QCSession.setMode(mode);
            QCSession.clear();
            empty.hidden = false;
            return;
          }

          try {
            document.title = "Report · " + (session.title || courseId || "Quest");
          } catch (_) {}

          QCReport.render(root, session);
          actions.hidden = false;
          certRoot.hidden = false;

          const requireTestimony =
            !site.certificate || site.certificate.require_testimony !== false;

          QCCertificate.mountForm(certRoot, {
            requireTestimony,
            onClaim: async (identity, statusEl) => {
              const payload = QCResults.buildPayload(session, identity, site);
              QCResults.storeLocalCopy(payload);
              const submitPayload =
                typeof QCResults.slimForSubmit === "function"
                  ? QCResults.slimForSubmit(payload)
                  : payload;

              let submitMsg = "";
              if (site.results && site.results.auto_submit !== false && site.results.endpoint) {
                statusEl.textContent = "Sending results securely…";
                const result = await QCResults.submit(submitPayload, site);
                if (result.ok) {
                  submitMsg =
                    " Results saved" +
                    (result.body && result.body.issue_url
                      ? " (GitHub issue opened)."
                      : ".");
                } else if (result.skipped) {
                  submitMsg = " (GitHub sync not configured yet.)";
                } else {
                  submitMsg =
                    " Could not reach the results server; certificate still downloads. Check backend/api.md.";
                }
              } else {
                submitMsg =
                  " GitHub sync is off until you set results.endpoint in config/site.json.";
                QCResults.downloadJson(
                  payload,
                  "quest-result-" + (session.session_id || "local") + ".json"
                );
              }

              QCCertificate.markClaimed(session);
              QCCertificate.downloadCertificatePdf(session, identity, site);
              statusEl.textContent =
                "Certificate downloaded." + submitMsg + " Resetting the session…";
              QCSession.setMode(mode);
              QCSession.clear();
              history.replaceState(null, "", "index.html");
              setTimeout(() => {
                location.href = "index.html";
              }, 1200);
            },
          });
        });
      })();
    </script>
  </body>
</html>
