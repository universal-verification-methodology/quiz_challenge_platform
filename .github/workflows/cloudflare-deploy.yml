# Deploy the static challenge site to Cloudflare Workers (assets).
# Live: https://quiz-challenge-platform.digital-design-challenge.workers.dev/
#
# One-time repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Workers edit permission for this account
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths-ignore:
      - "backend/**"
      - "docs/**"
      - "scripts/**"
      - "paper/**"
      - "**/*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quiz-challenge-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # assets.directory is "."; Workers will otherwise scan .git packs (>25 MiB)
      # and non-site trees even when .assetsignore should skip them.
      - name: Prune non-site paths before asset upload
        shell: bash
        run: |
          rm -rf .git backend .cursor paper scripts docs .wrangler node_modules
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          root = Path("content")
          removed = 0
          for course in root.glob("*"):
              media = course / "media"
              for scratch in ("_work", "_batch_logs"):
                  p = media / scratch
                  if p.exists():
                      shutil.rmtree(p, ignore_errors=True)
              log = media / "_batch_build.log"
              if log.exists():
                  log.unlink()
              images = media / "images"
              if images.is_dir():
                  for p in images.iterdir():
                      if p.is_dir() and p.name == "tools":
                          continue
                      if p.is_file() and p.suffix.lower() == ".png":
                          p.unlink()
                          removed += 1
          files = sum(1 for p in Path(".").rglob("*") if p.is_file())
          print(f"removed {removed} stem pngs; remaining files={files}")
          PY
          du -sh content/* || true

      - name: Deploy Worker (static assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.34.0"
          command: deploy
