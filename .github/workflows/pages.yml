# Deploy static challenge site to GitHub Pages.
#
# One-time: Settings → Pages → Source: GitHub Actions
# (also set via API: build_type=workflow)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "backend/**"
      - "docs/**"
      - "scripts/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quiz-challenge-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          root = Path("content")
          for course in root.glob("*"):
              media = course / "media"
              for scratch in ("_work", "_batch_logs"):
                  p = media / scratch
                  if p.exists():
                      shutil.rmtree(p, ignore_errors=True)
              images = media / "images"
              if images.is_dir():
                  for p in images.iterdir():
                      if p.is_dir() and p.name == "tools":
                          continue
                      if p.is_file() and p.suffix.lower() == ".png":
                          p.unlink()
          site = Path("_site")
          site.mkdir()
          for name in ("index.html", "challenge.html", "dashboard.html", "report.html"):
              shutil.copy2(name, site / name)
          for name in ("config", "css", "js"):
              shutil.copytree(name, site / name)
          shutil.move("content", site / "content")
          print("pages bundle ready")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
